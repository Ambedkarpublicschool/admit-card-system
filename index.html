<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambedkar Public School - Admit Card Portal</title>
  
  <!-- Fast QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Oswald for Titles & Inter/Poppins for Clean Text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #2563eb;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      color: #000;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ================= 1. FULL-SCREEN LOADER ================= */
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #cbd5e1;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 15px; font-weight: 700; color: #1e293b; }

    /* ================= 2. PARENT PAYMENT VIEW (MOBILE QR SCAN) ================= */
    #parentView {
      display: none;
      min-height: 100vh;
      padding: 20px 15px;
      background-color: #f8fafc;
      justify-content: center;
      align-items: flex-start;
    }
    .pay-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      padding: 24px 20px;
      text-align: center;
      margin-top: 15px;
      border: 1px solid #e2e8f0;
    }
    .pay-card .school-logo-parent { width: 65px; height: 65px; object-fit: contain; margin-bottom: 8px; filter: grayscale(100%); }
    .pay-card .school-title { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 2px; }
    .pay-card .school-sub { font-size: 12.5px; color: #64748b; margin-bottom: 16px; }
    .student-info-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      text-align: left;
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .live-fee-box {
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
      background: #fff1f2;
      border: 1px solid #fecdd3;
    }
    .live-fee-box.paid { background: #f0fdf4; border-color: #bbf7d0; }
    .fee-heading { font-size: 13px; font-weight: bold; color: #475569; }
    .fee-amount-text { font-size: 32px; font-weight: 900; color: #e11d48; margin: 4px 0 0 0; }
    .fee-amount-text.paid-text { color: #16a34a; font-size: 22px; }
    .btn-upi-pay {
      display: block; width: 100%;
      background: #16a34a; color: #ffffff;
      text-decoration: none; padding: 14px 0;
      border-radius: 10px; font-size: 16px; font-weight: bold;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
    }

    /* ================= 3. ADMIN PORTAL VIEW (WITH ADVANCED SORTING) ================= */
    #adminView {
      display: none;
      max-width: 1150px;
      margin: 24px auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .header-panel {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px; border-bottom: 2px solid #e2e8f0; padding-bottom: 14px;
    }
    .header-panel h2 { margin: 0; font-size: 22px; color: #0f172a; }
    .search-panel { display: flex; gap: 12px; margin-bottom: 16px; }
    .search-box-wrap {
      position: relative;
      flex: 1;
    }
    .search-box-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
    }
    .search-box-wrap input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14.5px;
      outline: none;
      transition: 0.2s;
    }
    .search-box-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .btn {
      background-color: var(--primary); color: #ffffff; border: none;
      padding: 10px 24px; font-size: 14.5px; font-weight: 600; cursor: pointer; border-radius: 8px;
      display: inline-flex; align-items: center; gap: 8px; transition: 0.2s;
    }
    .btn:hover { background-color: var(--primary-hover); }

    .table-container {
      max-height: 520px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; background: #fff; text-align: left; }
    th {
      background-color: #f8fafc;
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 700;
      color: #334155;
      border-bottom: 2px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 10;
      user-select: none;
      white-space: nowrap;
    }
    th.sortable {
      cursor: pointer;
      transition: background 0.15s;
    }
    th.sortable:hover {
      background-color: #e2e8f0;
    }
    th .sort-icon {
      font-size: 11px;
      margin-left: 6px;
      color: #94a3b8;
    }
    th.sorted-asc .sort-icon { color: var(--accent); }
    th.sorted-desc .sort-icon { color: var(--accent); }

    td {
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 14px;
      font-size: 13.5px;
      vertical-align: middle;
    }
    tr:hover { background-color: #f8fafc; }
    .fee-badge {
      display: inline-block;
      font-weight: 700;
      color: #b91c1c;
      background-color: #fef2f2;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #fee2e2;
    }

    /* ================= 4. PRINT VIEW (FULL A4 ADMIT CARD) ================= */
    .print-area { display: none; }

    @media print {
      body { background: transparent !important; padding: 0 !important; margin: 0 !important; }
      #parentView, #adminView, #loadingOverlay { display: none !important; }
      .print-area { display: block !important; }
      
      @page {
        size: A4 portrait;
        margin: 0;
      }

      .admit-card-page {
        width: 210mm;
        height: 297mm;
        page-break-after: always;
        position: relative;
        box-sizing: border-box;
        padding: 8mm;
        background: #fff;
      }

      .card-box {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        border: 2.5px solid #000;
        padding: 3mm;
        background: #fff;
      }
    }

    /* Double Border Frame */
    .card-inner-frame {
      width: 100%;
      height: 100%;
      border: 1.5px solid #000;
      border-radius: 14px;
      padding: 5mm 6mm;
      box-sizing: border-box;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Corner Ornaments */
    .corner-decor {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2.5px solid #000;
    }
    .corner-tl { top: 3px; left: 3px; border-right: none; border-bottom: none; border-top-left-radius: 8px; }
    .corner-tr { top: 3px; right: 3px; border-left: none; border-bottom: none; border-top-right-radius: 8px; }
    .corner-bl { bottom: 3px; left: 3px; border-right: none; border-top: none; border-bottom-left-radius: 8px; }
    .corner-br { bottom: 3px; right: 3px; border-left: none; border-top: none; border-bottom-right-radius: 8px; }

    /* Single Line Government Tagline */
    .top-gov-tagline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .tag-line {
      flex: 1;
      height: 1.2px;
      background-color: #000;
      position: relative;
      margin: 0 6px;
    }
    .tag-line::after {
      content: "•";
      position: absolute;
      top: -7px;
      font-size: 10px;
      color: #000;
    }
    .tag-line.left::after { right: 0; }
    .tag-line.right::after { left: 0; }
    
    .tag-text {
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.2px;
    }

    /* Header Main (Logo + Name + Address) */
    .header-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 2px;
    }
    .header-logo-img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: grayscale(100%);
    }
    .header-text-block {
      text-align: center;
    }
    .header-school-name {
      font-family: 'Oswald', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.8px;
      line-height: 1.05;
      margin: 0;
      text-transform: uppercase;
    }
    .header-school-addr {
      font-size: 12px;
      font-weight: 600;
      margin: 3px 0 0 0;
      color: #111;
    }

    /* Examination Badge */
    .exam-badge-container {
      text-align: center;
      margin: 5px 0 8px 0;
    }
    .exam-badge {
      display: inline-block;
      border: 1.5px solid #000;
      border-radius: 16px;
      padding: 2px 20px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      background: #fff;
    }
    .exam-badge::before { content: "❧ "; font-size: 11px; }
    .exam-badge::after { content: " ☙"; font-size: 11px; }

    /* Student Info & Photo Frame */
    .student-card-container {
      border: 1.5px solid #000;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
    }
    .student-details-list {
      width: 68%;
      display: flex;
      flex-direction: column;
      gap: 3.5px;
    }
    .s-row {
      display: flex;
      align-items: center;
      font-size: 11.5px;
      line-height: 1.35;
    }
    .s-icon {
      width: 17px;
      height: 17px;
      background: #000;
      color: #fff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 8.5px;
      margin-right: 7px;
      flex-shrink: 0;
    }
    .s-label {
      width: 105px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .s-colon {
      margin-right: 6px;
      font-weight: 700;
    }
    .s-val {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .student-photo-wrapper {
      width: 30%;
      display: flex;
      justify-content: flex-end;
      padding-left: 10px;
      border-left: 1.2px solid #cbd5e1;
    }
    .student-photo-frame {
      width: 42mm;
      height: 52mm;
      border: 1.5px solid #000;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }
    .student-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%);
    }

    /* Bottom Section */
    .bottom-split-container {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      height: 118mm;
    }

    /* Left Card: Fee & 40mm QR */
    .fee-qr-card {
      width: 38%;
      border: 1.5px solid #000;
      border-radius: 12px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      box-sizing: border-box;
    }
    .fee-title {
      font-size: 13px;
      font-weight: 800;
      width: 100%;
      text-align: left;
      padding-left: 4px;
    }
    .fee-digit {
      font-size: 20px;
      font-weight: 900;
      width: 100%;
      text-align: left;
      padding-left: 4px;
      margin-top: -2px;
      margin-bottom: 4px;
    }

    /* Exact 40mm x 40mm QR Frame */
    .qr-wrapper-styled {
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1.5px solid #000;
      border-radius: 8px;
      padding: 3px;
      background: #fff;
    }
    .qr-target-box {
      width: 40mm;
      height: 40mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-target-box img, .qr-target-box canvas {
      width: 40mm !important;
      height: 40mm !important;
      display: block;
    }
    .scan-me-pill {
      background: #000;
      color: #fff;
      font-size: 8.5px;
      font-weight: 900;
      letter-spacing: 0.8px;
      padding: 2px 14px;
      border-radius: 6px;
      margin-top: 3px;
      text-transform: uppercase;
    }

    /* User Requested Text Below QR */
    .exam-instruction-note {
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1.35;
      margin-top: 4px;
      padding: 0 2px;
    }

    .grad-cap-svg {
      width: 50px;
      height: 28px;
      margin-top: 2px;
    }

    /* Right Card: Time Table */
    .timetable-card {
      width: 62%;
      border: 1.5px solid #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .tt-ribbon-header {
      background: #000;
      color: #fff;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      padding: 4.5px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tt-time-strip {
      border-bottom: 1.5px solid #000;
      padding: 3px 6px;
      font-size: 10.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #fff;
    }
    .tt-time-strip i { font-size: 11px; }

    .tt-rows-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 2px 8px;
    }
    .tt-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dotted #444;
      padding: 3px 0;
      font-size: 10.5px;
    }
    .tt-item-row:last-child {
      border-bottom: none;
    }
    .tt-date-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 58%;
      font-weight: 600;
      line-height: 1.2;
    }
    .tt-cal-icon {
      width: 16px;
      height: 16px;
      background: #000;
      color: #fff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 7.5px;
      flex-shrink: 0;
    }
    .tt-subject-cell {
      width: 42%;
      font-weight: 800;
      text-align: center;
      font-size: 11.5px;
      border-left: 1px dotted #555;
      padding-left: 4px;
    }
  </style>
</head>
<body>

  <!-- 1. FULL-SCREEN LOADER -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">डेटा लोड हो रहा है... कृपया प्रतीक्षा करें</div>
  </div>

  <!-- 2. PARENT PAYMENT VIEW (When QR is Scanned) -->
  <div id="parentView">
    <div class="pay-card">
      <img src="" class="school-logo-parent" id="pSchoolLogo" alt="Logo">
      <div class="school-title" id="pSchoolName">Loading...</div>
      <div class="school-sub" id="pSchoolAddr">Loading...</div>

      <div class="student-info-box">
        <div><strong>Student Name:</strong> <span id="pName"></span></div>
        <div><strong>Father's Name:</strong> <span id="pFather"></span></div>
        <div><strong>Class:</strong> <span id="pClass"></span></div>
        <div><strong>Student ID:</strong> <span id="pId"></span></div>
      </div>

      <div class="live-fee-box" id="pFeeBox">
        <div class="fee-heading">वर्तमान लाइव बकाया शुल्क (Sheet Updated)</div>
        <div class="fee-amount-text" id="pFeeAmount">₹ 0</div>
      </div>

      <a href="#" id="pPayBtn" class="btn-upi-pay">Pay via PhonePe / GPay / Paytm</a>
    </div>
  </div>

  <!-- 3. ADMIN ADMIT CARD PRINT PORTAL VIEW -->
  <div id="adminView">
    <div class="header-panel">
      <h2 id="adminHeaderTitle">Admit Card Portal</h2>
      <button class="btn" onclick="printSelected()">
        <i class="fa-solid fa-print"></i> Print Selected Cards
      </button>
    </div>

    <div class="search-panel">
      <div class="search-box-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="नाम, पिता का नाम, क्लास या ID से खोजें..." onkeyup="filterStudents()">
      </div>
    </div>
    
    <div class="table-container">
      <table id="studentTable">
        <thead>
          <tr>
            <th width="40" style="text-align:center;">
              <input type="checkbox" id="selectAll" onclick="toggleAll(this)">
            </th>
            <th class="sortable" onclick="sortTable(1)">ID <i class="fa-solid fa-sort sort-icon"></i></th>
            <th class="sortable" onclick="sortTable(2)">Student Name <i class="fa-solid fa-sort sort-icon"></i></th>
            <th class="sortable" onclick="sortTable(3)">Father's Name <i class="fa-solid fa-sort sort-icon"></i></th>
            <th class="sortable" onclick="sortTable(4)">Class <i class="fa-solid fa-sort sort-icon"></i></th>
            <th class="sortable" onclick="sortTable(5)">Family ID <i class="fa-solid fa-sort sort-icon"></i></th>
            <th class="sortable" onclick="sortTable(6)">Fee Due (₹) <i class="fa-solid fa-sort sort-icon"></i></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 4. PRINT CONTAINER -->
  <div class="print-area" id="printContainer"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4REM5nUtH4Udy9T3axdq-bn5mlNUlX3Wsvx3JjQKCE0Wumyzk5IJgIec33VbkgCWn/exec";
    let globalData = null;
    let sortDirection = {};

    const urlParams = new URLSearchParams(window.location.search);
    const targetStudentId = urlParams.get('id') || urlParams.get('pay');

    async function initApp() {
      try {
        const response = await fetch(SCRIPT_URL);
        globalData = await response.json();
        
        document.getElementById("loadingOverlay").style.display = "none";

        if(globalData.schoolInfo) {
          document.getElementById("adminHeaderTitle").innerText = `${globalData.schoolInfo.schoolName || 'School'} - Admit Card Portal`;
        }

        if (targetStudentId) {
          showParentPaymentView(targetStudentId.trim().toUpperCase());
        } else {
          document.getElementById("adminView").style.display = "block";
          renderAdminTable(globalData.students);
        }
      } catch (err) {
        document.getElementById("loadingOverlay").innerHTML = `
          <div style="color:#ef4444; font-size:16px; font-weight:bold; text-align:center; padding:20px;">
            डेटा लोड करने में समस्या: ${err.message}
          </div>`;
      }
    }

    function showParentPaymentView(studentId) {
      document.getElementById("adminView").style.display = "none";
      const pView = document.getElementById("parentView");
      pView.style.display = "flex";

      const student = globalData.students.find(s => String(s.studentId).trim().toUpperCase() === studentId);
      const school = globalData.schoolInfo;

      if (!student) {
        pView.innerHTML = `<div class="pay-card"><h3 style="color:#ef4444;">छात्र ID (${studentId}) का रिकॉर्ड नहीं मिला।</h3></div>`;
        return;
      }

      document.getElementById("pSchoolLogo").src = school.logoLink || 'https://via.placeholder.com/65x65?text=Logo';
      document.getElementById("pSchoolName").innerText = school.schoolName || "School Name";
      document.getElementById("pSchoolAddr").innerText = school.schoolAddress || "School Address";
      document.getElementById("pName").innerText = student.name;
      document.getElementById("pFather").innerText = student.fatherName;
      document.getElementById("pClass").innerText = student.className;
      document.getElementById("pId").innerText = student.studentId;

      const feeBox = document.getElementById("pFeeBox");
      const feeText = document.getElementById("pFeeAmount");
      const payBtn = document.getElementById("pPayBtn");

      if (student.feeDue > 0) {
        feeText.innerText = `₹ ${student.feeDue}`;
        payBtn.innerText = `Pay ₹ ${student.feeDue} via PhonePe / GPay / Paytm`;
        payBtn.style.display = "block";
        
        const upiId = "kalpnathchaurasia2@ybl";
        const note = `Fee - ${student.name} (${student.className})`;
        payBtn.href = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(school.schoolName)}&am=${student.feeDue}&tn=${encodeURIComponent(note)}&cu=INR`;
      } else {
        feeBox.classList.add("paid");
        feeText.classList.add("paid-text");
        feeText.innerText = "✔ कोई बकाया शुल्क नहीं है (₹ 0)";
        payBtn.style.display = "none";
      }
    }

    function renderAdminTable(students) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = students.map((s, idx) => `
        <tr data-student-index="${idx}">
          <td style="text-align:center;"><input type="checkbox" class="stu-check" data-index="${idx}"></td>
          <td><strong>${s.studentId}</strong></td>
          <td>${s.name}</td>
          <td>${s.fatherName}</td>
          <td><strong>${s.className}</strong></td>
          <td>${s.mobile}</td>
          <td><span class="fee-badge">₹ ${s.feeDue}</span></td>
        </tr>
      `).join('');
    }

    // 🔹 Sort Table Columns
    function sortTable(colIndex) {
      const table = document.getElementById("studentTable");
      const tbody = document.getElementById("tableBody");
      const rows = Array.from(tbody.querySelectorAll("tr"));

      const isAsc = !sortDirection[colIndex];
      sortDirection = {};
      sortDirection[colIndex] = isAsc;

      table.querySelectorAll("th").forEach(th => {
        th.classList.remove("sorted-asc", "sorted-desc");
        const icon = th.querySelector(".sort-icon");
        if(icon) icon.className = "fa-solid fa-sort sort-icon";
      });

      const activeTh = table.querySelectorAll("th")[colIndex];
      activeTh.classList.add(isAsc ? "sorted-asc" : "sorted-desc");
      const activeIcon = activeTh.querySelector(".sort-icon");
      if(activeIcon) activeIcon.className = isAsc ? "fa-solid fa-sort-up sort-icon" : "fa-solid fa-sort-down sort-icon";

      rows.sort((a, b) => {
        let valA = a.children[colIndex].innerText.trim();
        let valB = b.children[colIndex].innerText.trim();

        let numA = parseFloat(valA.replace(/[^0-9.-]+/g, ""));
        let numB = parseFloat(valB.replace(/[^0-9.-]+/g, ""));

        if (!isNaN(numA) && !isNaN(numB)) {
          return isAsc ? numA - numB : numB - numA;
        }
        return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
      });

      rows.forEach(r => tbody.appendChild(r));
    }

    function filterStudents() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#tableBody tr");
      rows.forEach(r => {
        const text = r.innerText.toLowerCase();
        r.style.display = text.includes(q) ? "" : "none";
      });
    }

    function toggleAll(box) {
      document.querySelectorAll(".stu-check").forEach(cb => {
        if (cb.closest("tr").style.display !== "none") cb.checked = box.checked;
      });
    }

    function printSelected() {
      const selectedBoxes = Array.from(document.querySelectorAll(".stu-check:checked"));
      if (selectedBoxes.length === 0) {
        alert("कृपया प्रिंट करने के लिए कम से कम एक छात्र को चुनें!");
        return;
      }

      const printContainer = document.getElementById("printContainer");
      printContainer.innerHTML = "";
      
      const school = globalData.schoolInfo;
      const dSchoolName = school.schoolName || 'YOUR SCHOOL NAME';
      const dSchoolAddr = school.schoolAddress || 'Your School Address';
      const dExamName   = school.examName || 'Examination Name 2026-2027';
      const dLogoUrl    = school.logoLink || 'https://via.placeholder.com/52x52?text=Logo';

      selectedBoxes.forEach((cb, index) => {
        const s = globalData.students[cb.dataset.index];
        const qrId = `qr_card_${index}`;
        const photoUrl = s.photo ? s.photo.trim() : 'https://via.placeholder.com/100x130?text=No+Photo';

        const timetableRows = (s.schedule.timetable && s.schedule.timetable.length > 0)
          ? s.schedule.timetable.map(t => `
              <div class="tt-item-row">
                <div class="tt-date-cell">
                  <span class="tt-cal-icon"><i class="fa-solid fa-calendar-days"></i></span>
                  <span>${t.date}</span>
                </div>
                <div class="tt-subject-cell">${t.subject}</div>
              </div>
            `).join('')
          : `<div style="text-align:center; padding:20px; font-size:11px;">टाइम टेबल उपलब्ध नहीं है</div>`;

        const cardHtml = `
          <div class="admit-card-page">
            <div class="card-box">
              <div class="card-inner-frame">
                
                <!-- Corner Ornaments -->
                <div class="corner-decor corner-tl"></div>
                <div class="corner-decor corner-tr"></div>
                <div class="corner-decor corner-bl"></div>
                <div class="corner-decor corner-br"></div>

                <!-- Single Line Government Tagline -->
                <div class="top-gov-tagline">
                  <div class="tag-line left"></div>
                  <span class="tag-text">“A government recognized school (सरकार द्वारा मान्यता प्राप्त)”</span>
                  <div class="tag-line right"></div>
                </div>

                <!-- DYNAMIC School Header -->
                <div class="header-section">
                  <img src="${dLogoUrl}" class="header-logo-img" alt="Logo">
                  <div class="header-text-block">
                    <h1 class="header-school-name">${dSchoolName}</h1>
                    <div class="header-school-addr">${dSchoolAddr}</div>
                  </div>
                </div>

                <!-- DYNAMIC Examination Badge -->
                <div class="exam-badge-container">
                  <div class="exam-badge">${dExamName}</div>
                </div>

                <!-- Student Info Card -->
                <div class="student-card-container">
                  <div class="student-details-list">
                    <div class="s-row"><span class="s-icon"><i class="fa-solid fa-user"></i></span><span class="s-label">Name</span><span class="s-colon">:</span><span class="s-val">${s.name}</span></div>
                    <div class="s-row"><span class="s-icon"><i class="fa-solid fa-user-tie"></i></span><span class="s-label">Father’s Name</span><span class="s-colon">:</span><span class="s-val">${s.fatherName}</span></div>
                    <div class="s-row"><span class="s-icon"><i class="fa-solid fa-person-breastfeeding"></i></span><span class="s-label">Mother’s Name</span><span class="s-colon">:</span><span class="s-val">${s.motherName}</span></div>
                    <div class="s-row"><span class="s-icon"><i class="fa-solid fa-calendar-day"></i></span><span class="s-label">Date of Birth</span><span class="s-colon">:</span><span class="s-val">${s.dob}</span></div>
                    <div class="s-row"><span class="s-icon"><i class="fa-solid fa-venus-mars"></i></span><span class="s-label">Gender</span><span class="s-colon">:</span><span class="s-val">${s.gender}</span></div>
                    <div class="s-row"><span class="s-icon"><i class="fa-solid fa-book-open"></i></span><span class="s-label">Class</span><span class="s-colon">:</span><span class="s-val"><strong>${s.className}</strong></span></div>
                    <div class="s-row"><span class="s-icon"><i class="fa-solid fa-location-dot"></i></span><span class="s-label">Address</span><span class="s-colon">:</span><span class="s-val">${s.address}</span></div>
                    <div class="s-row"><span class="s-icon"><i class="fa-solid fa-phone"></i></span><span class="s-label">Mobile number</span><span class="s-colon">:</span><span class="s-val">${s.mobile}</span></div>
                    <div class="s-row"><span class="s-icon"><i class="fa-solid fa-users"></i></span><span class="s-label">Cast</span><span class="s-colon">:</span><span class="s-val">${s.caste}</span></div>
                    <div class="s-row"><span class="s-icon"><i class="fa-solid fa-layer-group"></i></span><span class="s-label">Category</span><span class="s-colon">:</span><span class="s-val">${s.category}</span></div>
                  </div>

                  <div class="student-photo-wrapper">
                    <div class="student-photo-frame">
                      <img src="${photoUrl}" loading="eager" decoding="async" onerror="this.src='https://via.placeholder.com/100x130?text=No+Photo'" alt="Student Photo">
                    </div>
                  </div>
                </div>

                <!-- Bottom Split Section -->
                <div class="bottom-split-container">
                  
                  <!-- Left: Fee Due & 40mm QR -->
                  <div class="fee-qr-card">
                    <div class="fee-title">Fee Due :-</div>
                    <div class="fee-digit">₹. ${s.feeDue}</div>
                    
                    <div class="qr-wrapper-styled">
                      <div class="qr-target-box" id="${qrId}"></div>
                      <div class="scan-me-pill">SCAN ME</div>
                    </div>

                    <div class="exam-instruction-note">
                      वर्तमान बकाया शुल्क जानने व जमा करने के लिए<br>QR स्कैन करें।
                    </div>

                    <!-- Graduation Cap & Book Vector Graphic -->
                    <svg class="grad-cap-svg" viewBox="0 0 100 55" fill="#000">
                      <path d="M50 4 L92 18 L50 32 L8 18 Z"/>
                      <path d="M22 24 L22 38 Q50 50 78 38 L78 24 Q50 35 22 24 Z"/>
                      <path d="M10 22 L6 25 L6 42 Q8 44 10 42 L10 22 Z"/>
                      <path d="M28 44 Q50 38 72 44 Q50 52 28 44 Z" fill="none" stroke="#000" stroke-width="1.8"/>
                    </svg>
                  </div>

                  <!-- Right: Time Table -->
                  <div class="timetable-card">
                    <div class="tt-ribbon-header">
                      <span>❧</span>
                      <span>Time Table for ${dExamName}</span>
                      <span>☙</span>
                    </div>

                    <div class="tt-time-strip">
                      <i class="fa-regular fa-clock"></i>
                      <span>TIME:- ${s.schedule.timeSlot || '08:30am to 11:00am'}</span>
                    </div>

                    <div class="tt-rows-container">
                      ${timetableRows}
                    </div>
                  </div>

                </div>

              </div>
            </div>
          </div>
        `;
        printContainer.insertAdjacentHTML('beforeend', cardHtml);
      });

      // 40mm QR Generation
      const currentOriginUrl = window.location.origin + window.location.pathname;
      selectedBoxes.forEach((cb, index) => {
        const s = globalData.students[cb.dataset.index];
        const qrElement = document.getElementById(`qr_card_${index}`);
        const dynamicStudentLink = `${currentOriginUrl}?id=${encodeURIComponent(s.studentId)}`;

        if (qrElement) {
          qrElement.innerHTML = "";
          new QRCode(qrElement, {
            text: dynamicStudentLink,
            width: 151,
            height: 151,
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      });

      setTimeout(() => {
        window.print();
      }, 180);
    }

    window.onload = initApp;
  </script>
</body>
</html>
